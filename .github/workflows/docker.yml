name: CI + CD (Build, Push, Deploy via SSM)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------
      # Backend Build & Push (commit SHA 태그)
      # -------------------------
      - name: Build & Push Backend
        run: |
          docker build -f backend/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/adaptscm-backend:${{ env.IMAGE_TAG }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/adaptscm-backend:${{ env.IMAGE_TAG }}

      # -------------------------
      # Frontend Build & Push (commit SHA 태그)
      # -------------------------
      - name: Build & Push Frontend
        run: |
          API_URL="${{ vars.VITE_API_BASE_URL }}"
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL="$API_URL" \
            -t ${{ secrets.DOCKER_USERNAME }}/adaptscm-frontend:${{ env.IMAGE_TAG }} ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/adaptscm-frontend:${{ env.IMAGE_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      # -------------------------
      # AWS 인증
      # -------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # -------------------------
      # SSM Deploy to EC2
      # -------------------------
      - name: Deploy via SSM
        run: |
          IMAGE_TAG="${{ env.IMAGE_TAG }}"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --region ap-northeast-2 \
            --query "Command.CommandId" \
            --output text \
            --parameters "{\"commands\":[
              \"cd /home/ubuntu/AdaptSCM\",
              \"git fetch origin develop\",
              \"git reset --hard origin/develop\",
              \"if grep -q '^IMAGE_TAG=' .env 2>/dev/null; then sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/' .env; else echo IMAGE_TAG=${IMAGE_TAG} >> .env; fi\",
              \"docker compose down\",
              \"docker compose pull\",
              \"docker compose up -d --remove-orphans\",
              \"docker compose ps\"
            ]}")

          echo "SSM command id: ${COMMAND_ID}"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region ap-northeast-2 \
              --query "Status" \
              --output text 2>/dev/null || true)
            echo "SSM status: ${STATUS}"
            if [ "${STATUS}" = "Success" ]; then
              break
            fi
            if [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ] || [ "${STATUS}" = "TimedOut" ]; then
              break
            fi
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region ap-northeast-2 \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json

          test "${STATUS}" = "Success"
