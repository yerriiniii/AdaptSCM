name: Build & Push Docker Images

# develop 푸시 → 이미지 빌드 후 Docker Hub에만 push.
# EC2 갱신은 SSH 인바운드 없이 Watchtower(docker-compose.watchtower.yml)가 Hub polling.
on:
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        run: |
          docker build -f backend/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/inventory-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/inventory-backend:latest

      - name: Build & Push Frontend
        run: |
          # 비어 있으면 동일 출처(https://도메인/api) — HTTPS 배포 시 EC2 http URL을 넣으면 혼합 콘텐츠로 API 호출이 막힙니다.
          API_URL="${{ vars.VITE_API_BASE_URL }}"
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL="$API_URL" \
            -t ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:latest