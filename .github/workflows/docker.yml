name: CI + CD (Build, Push, Deploy via SSM)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        run: |
          docker build -f backend/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/inventory-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/inventory-backend:latest

      - name: Build & Push Frontend
        run: |
          API_URL="${{ vars.VITE_API_BASE_URL }}"
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL="$API_URL" \
            -t ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd ~/Inventory-System",
              "docker pull yerriiniii/inventory-backend:latest",
              "docker pull yerriiniii/inventory-frontend:latest",
              "docker compose up -d"
            ]'