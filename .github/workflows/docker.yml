name: Build & Push Docker Images

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        run: |
          docker build -f backend/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/inventory-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/inventory-backend:latest

      - name: Build & Push Frontend
        run: |
          docker build -f frontend/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:latest