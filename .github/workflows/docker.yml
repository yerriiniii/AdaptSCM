name: Build & Push Docker Images

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        run: |
          docker build -f backend/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/inventory-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/inventory-backend:latest

      - name: Build & Push Frontend
        run: |
          API_URL="${{ vars.VITE_API_BASE_URL }}"
          if [ -z "$API_URL" ]; then
            echo "::error title=Missing VITE_API_BASE_URL::Repository variable VITE_API_BASE_URL is not set. GitHub → Settings → Secrets and variables → Actions → Variables. Example: http://ec2-xx-xx-xx.ap-northeast-2.compute.amazonaws.com:8000"
            exit 1
          fi
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL="$API_URL" \
            -t ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/develop' && secrets.EC2_HOST != '' && secrets.EC2_USER != '' && secrets.EC2_SSH_KEY != '' }}

    steps:
      # EC2 보안 그룹: TCP 22 인바운드 허용 필요. GitHub 호스티드 러너 IP는 매번 바뀌므로
      # "내 IP만"만 열려 있으면 SSH 연결이 거절됩니다. (테스트: 0.0.0.0/0 또는 GitHub meta IP 대역)
      - name: Deploy on EC2 (git sync + docker compose)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            cd ~/Inventory-System
            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop
            docker compose pull
            docker compose up -d