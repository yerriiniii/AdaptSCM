name: Build & Push Docker Images

# develop 푸시 → 이미지 빌드 → Docker Hub push → EC2에 SSH로 배포
on:
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        run: |
          docker build -f backend/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/inventory-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/inventory-backend:latest

      - name: Build & Push Frontend
        run: |
          # 비어 있으면 동일 출처(https://도메인/api)
          API_URL="${{ vars.VITE_API_BASE_URL }}"
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL="$API_URL" \
            -t ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker   # 👈 docker job 성공 후에만 실행

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/Inventory-System
            docker pull yerriiniii/inventory-backend:latest
            docker pull yerriiniii/inventory-frontend:latest
            docker compose up -d
          EOF